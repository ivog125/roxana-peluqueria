const logEl = document.getElementById('log');
function log(msg, type = '') {
  logEl.style.display = 'block';
  logEl.innerHTML += `<div class="${type}">${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

document.getElementById('import-btn').addEventListener('click', async () => {
  const btn = document.getElementById('import-btn');
  btn.disabled = true;
  btn.textContent = 'Importando...';
  log('<span class="info">Iniciando importación...</span>');

  let ok = 0, errors = 0;
  for (const prod of productos) {
    try {
      await addDoc(collection(db, 'productos'), { ...prod, createdAt: new Date().toISOString() });
      log(`<span class="ok">✓</span> ${prod.nombre}`);
      ok++;
    } catch(e) {
      log(`<span class="err">✗ Error en "${prod.nombre}": ${e.message}</span>`);
      errors++;
    }
  }
  log(`<br><span class="info">═══ Resultado: ${ok} importados, ${errors} errores ═══</span>`);
  btn.textContent = `✅ Listo (${ok}/${productos.length})`;
});
